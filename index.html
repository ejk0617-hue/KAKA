<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가가투어 — 여행 플랜</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --ink:#16324A;
    --ink-soft:#5A7183;
    --ink-faint:#8CA0AE;
    --paper:#F2F6F5;
    --surface:#FFFFFF;
    --surface-alt:#EAF2F0;
    --teal:#149E90;
    --teal-deep:#0E7A6F;
    --teal-tint:#DCF2EE;
    --coral:#FF6B4A;
    --coral-deep:#E24E30;
    --coral-tint:#FFE7E0;
    --gold:#E2960C;
    --gold-tint:#FBEDCD;
    --border:#DCE7E4;
    --shadow-sm: 0 1px 3px rgba(22,50,74,0.08);
    --shadow-md: 0 6px 20px rgba(22,50,74,0.09);
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    --font-num: 'Segoe UI', -apple-system, Consolas, 'Malgun Gothic', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#EAF2F0; --ink-soft:#A9BCC6; --ink-faint:#6E8592;
      --paper:#0D1E24; --surface:#15282F; --surface-alt:#1B333B;
      --teal:#3FCBBB; --teal-deep:#2EA89A; --teal-tint:#183833;
      --coral:#FF8A6B; --coral-deep:#FF6B4A; --coral-tint:#3A241E;
      --gold:#F2B705; --gold-tint:#3A2E12;
      --border:#25424B;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.35);
      --shadow-md: 0 6px 24px rgba(0,0,0,0.4);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-ui);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #app{min-height:100vh;}
  h1,h2,h3,h4{text-wrap:balance; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  .num{font-variant-numeric:tabular-nums; font-family:var(--font-num);}

  /* ---------- shell ---------- */
  .shell{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh;}
  @media (max-width:820px){ .shell{grid-template-columns:1fr;} }

  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:26px 18px;
    display:flex; flex-direction:column; gap:26px;
    position:sticky; top:0; height:100vh;
  }
  @media (max-width:820px){
    .sidebar{position:static; height:auto; flex-direction:row; align-items:center; justify-content:space-between; padding:14px 18px; border-right:none; border-bottom:1px solid var(--border); flex-wrap:wrap; row-gap:10px;}
    .sidebar-nav{flex-direction:row !important; gap:8px !important;}
    .sidebar-foot{display:none;}
  }

  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--teal),var(--teal-deep));
    display:flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow:var(--shadow-sm);
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text b{font-size:clamp(16px,4.2vw,18px); font-weight:800; letter-spacing:-0.2px;}
  .brand-text span{font-size:10px; letter-spacing:1.5px; color:var(--ink-faint); font-weight:700;}

  .sidebar-nav{display:flex; flex-direction:column; gap:4px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:var(--radius-sm);
    border:none; background:transparent; color:var(--ink-soft);
    font-size:14.5px; font-weight:600; text-align:left; width:100%;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item .ic{font-size:17px;}
  .nav-item:hover{background:var(--surface-alt); color:var(--ink);}
  .nav-item.active{background:var(--teal-tint); color:var(--teal-deep);}
  .nav-badge{margin-left:auto; font-size:11px; background:var(--surface-alt); color:var(--ink-soft); padding:2px 7px; border-radius:20px; font-weight:700;}
  .nav-item.active .nav-badge{background:var(--surface); color:var(--teal-deep);}

  .sync-badge{display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface-alt); border-radius:999px; padding:7px 12px; font-size:11.5px; font-weight:700; color:var(--ink-soft); width:100%; text-align:left;}
  .sync-badge:hover{background:var(--border);}
  .sync-dot{width:8px;height:8px;border-radius:50%; flex:none; background:var(--ink-faint);}
  .sync-badge.ok .sync-dot{background:var(--teal); box-shadow:0 0 0 3px var(--teal-tint);}
  .sync-badge.syncing .sync-dot{background:var(--gold); box-shadow:0 0 0 3px var(--gold-tint);}
  .sync-badge.error .sync-dot,.sync-badge.offline .sync-dot{background:var(--coral); box-shadow:0 0 0 3px var(--coral-tint);}

  .sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:12px; font-size:11.5px; color:var(--ink-faint); border-top:1px dashed var(--border); padding-top:14px;}

  .main{padding:30px 34px 60px; max-width:1240px; min-width:0;}
  @media (max-width:820px){ .main{padding:20px 16px 50px;} }

  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .page-head h1{font-size:clamp(20px,5.5vw,25px); font-weight:800; letter-spacing:-0.3px;}
  .page-head p{margin:4px 0 0; color:var(--ink-soft); font-size:clamp(12.5px,3.2vw,13.5px);}

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border:none; border-radius:999px; padding:10px 18px;
    font-size:13.5px; font-weight:700; white-space:nowrap;
    box-shadow:var(--shadow-sm);
  }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-deep);}
  .btn-coral{background:var(--coral); color:#fff;}
  .btn-coral:hover{background:var(--coral-deep);}
  .btn-ghost{background:var(--surface-alt); color:var(--ink);}
  .btn-ghost:hover{background:var(--border);}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  .btn-danger{background:var(--coral-tint); color:var(--coral-deep);}
  .icon-btn{
    border:none; background:var(--surface-alt); color:var(--ink-soft);
    width:30px; height:30px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; flex:none;
  }
  .icon-btn:hover{background:var(--border); color:var(--ink);}
  .icon-btn.sm{width:24px;height:24px;font-size:12px;border-radius:7px;}

  /* ---------- stat tiles ---------- */
  .stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px;}
  @media (max-width:640px){ .stats-row{grid-template-columns:1fr;} }
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:16px 18px; display:flex; align-items:center; gap:13px; box-shadow:var(--shadow-sm);
  }
  .stat-tile .ic{
    width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px; flex:none;
    background:var(--teal-tint);
  }
  .stat-tile.alt .ic{background:var(--coral-tint);}
  .stat-tile.gold .ic{background:var(--gold-tint);}
  .stat-tile b{display:block; font-size:clamp(17px,4.5vw,20px); font-weight:800; letter-spacing:-.3px;}
  .stat-tile span{font-size:clamp(11px,2.8vw,12px); color:var(--ink-soft); font-weight:600;}

  /* ---------- trip section / cards ---------- */
  .eyebrow{font-size:12px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.6px; margin-bottom:10px;}
  .trip-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr)); gap:14px;}

  .ticket{
    display:flex; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    overflow:hidden; box-shadow:var(--shadow-sm); cursor:pointer; text-align:left; position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .ticket:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
  .ticket-stub{
    width:82px; flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:var(--teal-tint); position:relative; padding:10px 6px;
    border-right:2px dashed var(--border);
    background-size:cover; background-position:center;
  }
  .ticket.intl .ticket-stub{background-color:var(--coral-tint);}
  .ticket-stub.has-photo .emoji{display:none;}
  .ticket-stub::before,.ticket-stub::after{
    content:''; position:absolute; width:16px;height:16px;border-radius:50%; background:var(--paper); left:-8px;
  }
  .ticket-stub::before{top:-8px;} .ticket-stub::after{bottom:-8px;}
  .ticket-stub .emoji{font-size:26px;}
  .ticket-stub .dday{font-size:11px; font-weight:800; color:var(--teal-deep); background:var(--surface); padding:2px 7px; border-radius:20px;}
  .ticket.intl .ticket-stub .dday{color:var(--coral-deep);}
  .ticket-body{flex:1; padding:13px 15px; min-width:0; display:flex; flex-direction:column; gap:6px;}
  .ticket-body .place{font-size:11px; font-weight:700; color:var(--ink-faint); letter-spacing:.4px; text-transform:uppercase;}
  .ticket-body h3{font-size:clamp(14px,4vw,15.5px); font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ticket-body .dates{font-size:12px; color:var(--ink-soft);}
  .ticket-meta{display:flex; gap:8px; margin-top:2px; flex-wrap:wrap;}
  .pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--surface-alt); color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px;}
  .pill.status-ongoing{background:var(--gold-tint); color:var(--gold);}
  .pill.status-done{background:var(--surface-alt); color:var(--ink-faint);}
  .pill.currency{background:var(--gold-tint); color:var(--gold);}
  .pill.map-pill{background:var(--teal-tint); color:var(--teal-deep); font-weight:800; text-decoration:none;}
  .pill.map-pill:hover{background:var(--teal); color:#fff;}
  .trip-del{position:absolute; top:8px; right:8px; opacity:.55;}
  .trip-del:hover{opacity:1;}

  .empty{
    border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:34px 20px; text-align:center; color:var(--ink-soft);
    background:var(--surface); font-size:13.5px;
  }
  .empty .big{font-size:30px; display:block; margin-bottom:8px;}

  /* ---------- trip detail ---------- */
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ink-soft); background:none; border:none; padding:0; margin-bottom:14px;}
  .back-link:hover{color:var(--ink);}

  .trip-head{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:20px 22px; display:flex; align-items:center; gap:18px; margin-bottom:22px; box-shadow:var(--shadow-sm); flex-wrap:wrap;
  }
  .photo-wrap{position:relative; width:66px; height:66px; border-radius:16px; overflow:hidden; flex:none; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; font-size:38px;}
  .photo-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-edit{position:absolute; bottom:-4px; right:-4px; width:24px; height:24px; border-radius:50%; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; box-shadow:var(--shadow-sm); cursor:pointer;}
  .photo-remove{position:absolute; top:-6px; right:-6px; width:20px; height:20px; font-size:10px; border-radius:50%;}
  .trip-head .info{flex:1; min-width:220px;}
  .trip-head h1{font-size:clamp(17px,4.8vw,21px); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .trip-head .meta-line{color:var(--ink-soft); font-size:clamp(12px,3.2vw,13px); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .trip-head .companions{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .chip{background:var(--surface-alt); color:var(--ink-soft); font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px;}
  .chip.me{background:var(--teal-tint); color:var(--teal-deep);}

  .detail-grid{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:20px; align-items:start;}
  @media (max-width:900px){ .detail-grid{grid-template-columns:minmax(0,1fr);} }
  .main-col{min-width:0;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 22px; box-shadow:var(--shadow-sm);}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .card-head h2{font-size:clamp(14px,3.8vw,15.5px); font-weight:800; display:flex; align-items:center; gap:7px;}

  /* ---------- itinerary spreadsheet ---------- */
  .sheet-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-md);}
  table.sheet{border-collapse:collapse; table-layout:fixed;}
  table.sheet th{background:var(--surface-alt); color:var(--ink-soft); font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; padding:9px 8px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--border); position:relative; overflow:hidden;}
  table.sheet td{padding:3px 4px; border-bottom:1px solid var(--border); vertical-align:middle; overflow:hidden;}
  table.sheet tr:last-child td{border-bottom:none;}
  table.sheet tbody tr:hover{background:var(--surface-alt);}
  table.sheet input{width:100%; border:1px solid transparent; background:transparent; padding:7px 7px; border-radius:7px; font-size:12.5px; color:var(--ink); font-family:inherit;}
  table.sheet input:hover{background:var(--surface-alt); border-color:var(--border);}
  table.sheet input:focus{background:var(--paper); border-color:var(--teal); outline:none;}
  table.sheet input[type=date],table.sheet input[type=time],table.sheet input[type=number]{font-variant-numeric:tabular-nums;}
  table.sheet td.readonly{color:var(--ink-soft); font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; padding:7px 10px; font-size:12.5px;}
  .col-resizer{position:absolute; right:-3px; top:0; bottom:0; width:7px; cursor:col-resize; z-index:2; touch-action:none;}
  .col-resizer:hover, .col-resizer.active{background:var(--teal);}
  .row-actions{display:flex; gap:3px;}
  .row-del{border:none;background:var(--surface-alt); color:var(--ink-faint); width:24px;height:24px;border-radius:7px; font-size:11px; flex:none;}
  .row-del:hover{background:var(--coral-tint); color:var(--coral-deep);}
  .row-del[disabled]{opacity:.3; cursor:default; pointer-events:none;}
  .sheet-add{padding:12px 2px 0; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .sheet-hint{font-size:11.5px; color:var(--ink-faint);}

  .rail-section{margin-bottom:16px;}
  .rail-label{font-size:11px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;}
  .compare-bar{margin-bottom:10px;}
  .compare-bar .row{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; font-weight:700;}
  .compare-bar .track{height:9px; background:var(--surface-alt); border-radius:20px; overflow:hidden;}
  .compare-bar .fill{height:100%; border-radius:20px;}
  .fill.plan{background:var(--teal);}
  .fill.actual{background:var(--coral);}

  .sum-line{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; padding:6px 0;}
  .sum-line .k{color:var(--ink-soft);}
  .sum-line .v{font-weight:800;}
  .sum-line.total .v{font-size:17px; color:var(--teal-deep);}
  .sum-line.diff .v.pos{color:var(--coral-deep);}
  .sum-line.diff .v.neg{color:var(--teal-deep);}

  .expense-item{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-bottom:1px dashed var(--border);}
  .expense-item:last-child{border-bottom:none;}
  .expense-item .meta{font-size:11.5px; color:var(--ink-faint);}
  .expense-item .item{font-size:13px; font-weight:700;}
  .expense-item .amt{font-size:13px; font-weight:800; white-space:nowrap;}

  .exp-add{display:flex; flex-direction:column; gap:7px; margin-top:12px; padding-top:14px; border-top:1px dashed var(--border);}
  .exp-add input{width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 11px; font-size:12.5px; background:var(--paper); color:var(--ink);}
  .exp-add .row2{display:flex; gap:7px;}
  .exp-add .row2 input{flex:1; min-width:0;}
  .exp-add button{width:100%; justify-content:center;}

  .split-row{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px; align-items:start;}
  @media (max-width:700px){ .split-row{grid-template-columns:1fr;} }

  .resto-item{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-bottom:1px dashed var(--border);}
  .resto-item:last-child{border-bottom:none;}
  .resto-item .resto-main{min-width:0;}
  .resto-item .resto-name{font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .resto-item .resto-meta{font-size:11.5px; color:var(--ink-faint);}
  .resto-item .resto-actions{display:flex; align-items:center; gap:5px; flex:none;}

  .note-box textarea{width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; background:var(--paper); color:var(--ink); resize:vertical; min-height:70px;}

  .lock-card{max-width:360px; margin:40px auto 0; text-align:center;}
  .lock-emoji{font-size:42px; margin-bottom:6px;}
  .lock-card h2{font-size:clamp(16px,5vw,18px); font-weight:800; margin-bottom:4px;}
  .lock-card p{font-size:13px; color:var(--ink-soft); margin-bottom:18px;}
  .lock-card form{display:flex; flex-direction:column; gap:10px;}
  .lock-card input[type=password]{border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:13.5px; background:var(--paper); color:var(--ink); text-align:center;}
  .pill.lock-pill{background:var(--coral-tint); color:var(--coral-deep); font-weight:800;}

  /* ---------- tabs ---------- */
  .tabbar{display:flex; gap:8px; margin-bottom:20px;}
  .tab{padding:9px 18px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:13.5px; font-weight:700; color:var(--ink-soft);}
  .tab.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .tab .ic{margin-right:5px;}

  /* ---------- checklist ---------- */
  .progress-wrap{display:flex; align-items:center; gap:12px;}
  .progress-track{flex:1; height:10px; background:var(--surface-alt); border-radius:20px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--gold)); border-radius:20px; transition:width .2s ease;}
  .progress-label{font-size:12.5px; font-weight:800; color:var(--ink-soft); white-space:nowrap;}

  .cat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .cat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column;}
  .cat-head{display:flex; align-items:center; gap:6px; margin-bottom:6px; padding-bottom:9px; border-bottom:1.5px dashed var(--border);}
  .cat-head b{flex:1; font-size:13.5px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cat-head input{flex:1; min-width:0; font-size:13px; font-weight:800; border:1.5px solid var(--teal); border-radius:6px; padding:4px 7px; background:var(--paper); color:var(--ink);}
  .cat-count{font-size:10.5px; color:var(--ink-faint); font-weight:700; white-space:nowrap;}

  .pack-list{display:flex; flex-direction:column; gap:1px; flex:1;}
  .pack-item{display:flex; align-items:center; gap:9px; padding:8px 2px; border-bottom:1px solid var(--border);}
  .pack-item:last-child{border-bottom:none;}
  .pack-item input[type=checkbox]{width:18px;height:18px; accent-color:var(--teal); flex:none;}
  .pack-item label{flex:1; font-size:13px; font-weight:600; word-break:break-word;}
  .pack-item.checked label{color:var(--ink-faint); text-decoration:line-through;}
  .cat-empty{font-size:12px; color:var(--ink-faint); padding:10px 0;}

  .cat-add-item{display:flex; gap:6px; margin-top:9px;}
  .cat-add-item input{flex:1; min-width:0; border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:12.5px; background:var(--paper); color:var(--ink);}

  /* ---------- form / modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(13,25,30,.45); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}

  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field select, .field textarea{
    width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:13.5px; background:var(--paper); color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:60px;}
  .seg{display:flex; gap:8px;}
  .seg-btn{flex:1; padding:10px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--paper); font-weight:700; font-size:13px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; gap:6px;}
  .seg-btn.on{border-color:var(--teal); background:var(--teal-tint); color:var(--teal-deep);}
  .seg-btn.on.intl{border-color:var(--coral); background:var(--coral-tint); color:var(--coral-deep);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .confirm-msg{font-size:13.5px; color:var(--ink-soft); margin-bottom:18px;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";
  var KEY = "gagatour_state_v2";
  var domesticPlaces = [
    {e:"🏙️",n:"서울"},{e:"🌊",n:"부산"},{e:"🍊",n:"제주도"},{e:"🏯",n:"경주"},
    {e:"☕",n:"강릉"},{e:"🌅",n:"여수"},{e:"🎨",n:"전주"},{e:"⛰️",n:"속초"},
    {e:"🌸",n:"경성/인천"},{e:"🍎",n:"대구"},{e:"📍",n:"기타 (직접 입력)"}
  ];
  var intlPlaces = [
    {e:"🗼",n:"일본 · 도쿄"},{e:"🏯",n:"일본 · 오사카"},{e:"🛺",n:"태국 · 방콕"},
    {e:"🌉",n:"베트남 · 다낭"},{e:"🥐",n:"프랑스 · 파리"},{e:"🗽",n:"미국 · 뉴욕"},
    {e:"🍝",n:"이탈리아 · 로마"},{e:"⛲",n:"스페인 · 바르셀로나"},{e:"🎡",n:"영국 · 런던"},
    {e:"🐨",n:"호주 · 시드니"},{e:"🏝️",n:"괌 / 사이판"},{e:"📍",n:"기타 (직접 입력)"}
  ];
  var placeCurrency = {
    "일본 · 도쿄":"JPY","일본 · 오사카":"JPY","태국 · 방콕":"THB","베트남 · 다낭":"VND",
    "프랑스 · 파리":"EUR","미국 · 뉴욕":"USD","이탈리아 · 로마":"EUR","스페인 · 바르셀로나":"EUR",
    "영국 · 런던":"GBP","호주 · 시드니":"AUD","괌 / 사이판":"USD"
  };
  var currencyOptions = ["JPY","USD","EUR","CNY","THB","VND","GBP","AUD"];
  var defaultColWidth = {date:112,dep:78,arr:78,dur:92,place:128,map:150,detail:170,cost:104,rate:92,krw:112,per:104,actions:108};

  function defaultPackingCategories(type){
    // id는 고정 문자열로 둬서, 서로 다른 기기가 각자 처음 켰을 때 만든 기본 카테고리가
    // 나중에 동기화될 때 같은 항목으로 인식되고 중복되지 않도록 한다.
    var base = [
      {key:"essentials", name:"필수품", items: type==="international" ? ["여권","항공권 (E-Ticket)","여행자보험","환전한 현금 · 카드"] : ["신분증","현금 · 카드","여행일정표"]},
      {key:"clothing", name:"의류 / 잡화", items:["여벌 옷","속옷 · 양말","편한 신발","우산 또는 우비"]},
      {key:"toiletries", name:"세면용품", items:["칫솔 · 치약","샴푸 · 바디워시","수건","선크림"]},
      {key:"electronics", name:"전자기기", items: type==="international" ? ["해외용 어댑터","보조배터리","이어폰","유심 · 로밍"] : ["보조배터리","이어폰","충전기"]},
      {key:"medicine", name:"상비약", items:["두통약","밴드","소화제","멀미약"]}
    ];
    if(type==="international") base.push({key:"docs", name:"서류", items:["여권 사본","여분 증명사진","국제운전면허증 (필요 시)"]});
    var now = Date.now();
    return base.map(function(c){
      return {
        id: "cat-"+type+"-"+c.key, name:c.name, _ts: now,
        items: c.items.map(function(t,i){ return {id:"item-"+type+"-"+c.key+"-"+i, text:t, checked:false}; })
      };
    });
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function won(n){ return (Number(n)||0).toLocaleString("ko-KR") + "원"; }
  function localAmt(trip, n){ return (Number(n)||0).toLocaleString("ko-KR") + (trip.currency ? " "+trip.currency : ""); }
  function flattenItems(catList){ return (catList||[]).reduce(function(acc,c){ return acc.concat(c.items||[]); },[]); }
  function isHttpUrl(u){ return typeof u==="string" && /^https?:\/\//i.test(u.trim()); }
  function touch(record){ if(record) record._ts = Date.now(); return record; }

  /* ================= 여행별 비밀번호 보호 (클라이언트 암호화) =================
     비밀번호를 설정하면 그 여행의 이름/일정/비용/메모 등은 AES-GCM으로 암호화되어
     salt/iv/cipher(암호문)만 저장·동기화된다. 비밀번호를 입력해야만 복호화해서 볼 수 있고,
     비밀번호를 잊으면 아무도(공유 저장소에 접근할 수 있는 사람도) 복구할 수 없다. */
  var unlockedData = {}; // tripId -> 복호화된 실제 여행 객체 (이 세션에서 잠금 해제됨)
  var unlockedKeys = {}; // tripId -> {key: CryptoKey, saltB64: string}

  function bufToB64(buf){
    var bytes = new Uint8Array(buf), bin = "";
    for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64ToBuf(b64){
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  function deriveKey(password, saltBuf){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(password), {name:"PBKDF2"}, false, ["deriveKey"]).then(function(keyMaterial){
      return crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:saltBuf, iterations:150000, hash:"SHA-256"},
        keyMaterial, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
      );
    });
  }
  function encryptWithKey(key, obj){
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var data = new TextEncoder().encode(JSON.stringify(obj));
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, data).then(function(cipherBuf){
      return { iv: bufToB64(iv), cipher: bufToB64(cipherBuf) };
    });
  }
  function decryptTripPayload(password, saltB64, ivB64, cipherB64){
    return deriveKey(password, b64ToBuf(saltB64)).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBuf(ivB64)}, key, b64ToBuf(cipherB64)).then(function(plainBuf){
        return { key:key, payload: JSON.parse(new TextDecoder().decode(plainBuf)) };
      });
    });
  }
  var LOCKED_FIELDS = ["name","place","companions","currency","mapUrl","photo","itinerary","expenses","restaurants","note"];
  function reencryptAndStore(tripId){
    var view = unlockedData[tripId];
    var keyInfo = unlockedKeys[tripId];
    var payload = {};
    LOCKED_FIELDS.forEach(function(f){ payload[f] = view[f]; });
    return encryptWithKey(keyInfo.key, payload).then(function(enc){
      var idx = state.trips.findIndex(function(t){ return t.id===tripId; });
      var envelope = { id:tripId, type:view.type, startDate:view.startDate, endDate:view.endDate, emoji:view.emoji, locked:true, salt:keyInfo.saltB64, iv:enc.iv, cipher:enc.cipher, _ts: Date.now() };
      if(idx>=0) state.trips[idx] = envelope; else state.trips.push(envelope);
    });
  }
  function commitAndSave(tripId){
    if(unlockedKeys[tripId] && unlockedData[tripId]){
      reencryptAndStore(tripId).then(function(){ save(); });
    } else {
      save();
    }
  }

  function migrate(state){
    if(!state.trips) state.trips = [];
    if(!state.packing) state.packing = {};
    if(!state.colWidths) state.colWidths = {};
    if(!state._tombstones) state._tombstones = {};
    ["domestic","international"].forEach(function(key){
      var list = state.packing[key];
      if(!Array.isArray(list) || list.length===0){
        state.packing[key] = defaultPackingCategories(key);
      } else if(list[0] && typeof list[0].items === "undefined"){
        state.packing[key] = [{id:uid(), name:"전체", _ts:Date.now(), items:list}];
      }
    });
    state.trips.forEach(function(t){
      if(t.locked){ if(!t._ts) t._ts = Date.now(); return; }
      if(!t.itinerary) t.itinerary = [];
      if(!t.expenses) t.expenses = [];
      if(!t.restaurants) t.restaurants = [];
      if(!t.companions) t.companions = [];
      if(typeof t.note !== "string") t.note = "";
      if(t.type==="international" && !t.currency) t.currency = "USD";
      if(!t._ts) t._ts = Date.now();
    });
    return state;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw) return migrate(JSON.parse(raw));
    }catch(e){}
    return migrate({ trips: [], packing: {}, colWidths: {}, _tombstones: {} });
  }
  var state = loadState();
  function save(){
    localStorage.setItem(KEY, JSON.stringify(state));
    scheduleServerPush();
  }

  var nav = { view:"home", tripId:null, packTab:"domestic", tripTab:"domestic", editingCatId:null };
  var modal = null; // {type, payload}
  var resizing = null; // {field, startX, startWidth, col}

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function dateOnly(s){ return new Date(s+"T00:00:00"); }
  function clampDate(d, min, max){ if(d < min) return min; if(d > max) return max; return d; }

  function tripStatus(trip){
    var today = dateOnly(todayStr());
    var start = dateOnly(trip.startDate), end = dateOnly(trip.endDate);
    if(today < start){
      var days = Math.round((start-today)/86400000);
      return {kind:"upcoming", label:"D-"+days, days:days};
    }
    if(today >= start && today <= end) return {kind:"ongoing", label:"여행중"};
    return {kind:"done", label:"다녀왔어요"};
  }

  function totalTravelers(trip){ return 1 + (trip.companions||[]).length; }
  function toKRW(trip, amount, rate){
    if(trip.type==="international") return (Number(amount)||0) * (Number(rate)||1);
    return Number(amount)||0;
  }
  function planTotal(trip){ return (trip.itinerary||[]).reduce(function(s,i){ return s+toKRW(trip,i.cost,i.rate); },0); }
  function actualTotal(trip){ return (trip.expenses||[]).reduce(function(s,e){ return s+toKRW(trip,e.amount,e.rate); },0); }

  function formatDuration(dep,arr){
    if(!dep || !arr) return "-";
    var dp = dep.split(":").map(Number), ap = arr.split(":").map(Number);
    var diff = (ap[0]*60+ap[1]) - (dp[0]*60+dp[1]);
    var overnight = false;
    if(diff <= 0){ diff += 1440; overnight = true; }
    var h = Math.floor(diff/60), m = diff%60;
    var str = "";
    if(h>0) str += h+"시간 ";
    if(m>0 || h===0) str += m+"분";
    return str.trim() + (overnight ? " · 익일" : "");
  }
  function fmtRange(s,e){
    var sd = dateOnly(s), ed = dateOnly(e);
    var f = function(d){ return (d.getMonth()+1)+"."+d.getDate(); };
    var nights = Math.round((ed-sd)/86400000);
    return f(sd) + " – " + f(ed) + " (" + (nights<=0? "당일치기" : nights+"박 "+(nights+1)+"일") + ")";
  }

  function getTrip(id){
    var meta = state.trips.find(function(t){ return t.id===id; });
    if(!meta) return null;
    if(meta.locked) return unlockedData[id] || null;
    return meta;
  }
  function colWidth(field){ return (state.colWidths && state.colWidths[field]) || defaultColWidth[field] || 110; }

  /* ================= REALTIME SYNC (Firebase Realtime Database) =================
     설정을 안 하면 이 기기에만 저장되는 "로컬 전용 모드"로 동작한다.
     Firebase 설정을 붙여넣으면, 같은 설정을 넣은 다른 사람·다른 기기와
     실시간으로 데이터가 공유된다 (여행/체크리스트 카테고리 단위로 병합). */
  var FIREBASE_CONFIG_KEY = "gagatour_firebase_config";
  var FIREBASE_DB_PATH = "gagatourData";
  var syncStatus = {state:"idle", lastSync:null, message:""}; // idle|syncing|ok|offline|error
  var pushTimer = null;
  var firebaseApp = null, firebaseDb = null, firebaseListenerAttached = false;
  var pendingLocalPush = false;

  function getFirebaseConfig(){
    try{ var raw = localStorage.getItem(FIREBASE_CONFIG_KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  function setFirebaseConfig(c){ try{ localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(c)); }catch(e){} }
  function clearFirebaseConfig(){ try{ localStorage.removeItem(FIREBASE_CONFIG_KEY); }catch(e){} }

  function parseFirebaseConfigText(text){
    try{ return JSON.parse(text); }catch(e){}
    try{
      var m = text.match(/\{[\s\S]*\}/);
      if(!m) return null;
      var obj = new Function("return (" + m[0] + ");")();
      if(obj && typeof obj==="object" && obj.databaseURL) return obj;
      return null;
    }catch(e){ return null; }
  }

  function openSyncSetup(){
    var current = getFirebaseConfig();
    var currentText = current ? JSON.stringify(current, null, 2) : "";
    var pasted = window.prompt(
      "구글 Firebase 설정을 붙여넣으면, 같은 설정을 쓰는 다른 기기·다른 사람과 실시간으로 데이터가 공유돼요.\n" +
      "(Firebase 콘솔 → 프로젝트 설정 → 일반 탭 → \"내 앱\"의 SDK 설정 및 구성 코드를 그대로 복사해서 붙여넣으세요)\n\n" +
      "비워두고 확인을 누르면 이 기기에만 저장되는 로컬 전용 모드로 전환됩니다.",
      currentText
    );
    if(pasted===null) return;
    var trimmed = pasted.trim();
    if(!trimmed){
      clearFirebaseConfig();
      detachFirebaseListener();
      syncStatus = {state:"idle", lastSync:null, message:""};
      render();
      window.alert("로컬 전용 모드로 전환했습니다.");
      return;
    }
    var parsed = parseFirebaseConfigText(trimmed);
    if(!parsed){
      window.alert("Firebase 설정을 인식하지 못했어요. databaseURL이 포함된 설정 코드 전체를 붙여넣어주세요.");
      return;
    }
    setFirebaseConfig(parsed);
    initFirebaseSync(true);
  }

  function initFirebaseSync(showAlert){
    var config = getFirebaseConfig();
    if(!config){ syncStatus = {state:"idle", lastSync:null, message:""}; render(); return; }
    if(typeof firebase === "undefined"){
      syncStatus = {state:"offline", lastSync:syncStatus.lastSync, message:"라이브러리 로딩 중"};
      render();
      if(showAlert) window.alert("Firebase 라이브러리를 아직 불러오는 중이에요. 인터넷 연결을 확인하고 잠시 후 다시 시도해주세요.");
      return;
    }
    try{
      firebaseApp = (firebase.apps && firebase.apps.length) ? firebase.apps[0] : firebase.initializeApp(config);
      firebaseDb = firebase.database();
      syncStatus.state = "syncing"; render();
      attachFirebaseListener();
    }catch(e){
      console.error("Firebase 초기화 실패:", e);
      syncStatus = {state:"error", lastSync:syncStatus.lastSync, message:e.message};
      render();
      if(showAlert) window.alert("Firebase 연결에 실패했어요: " + e.message);
    }
  }

  function detachFirebaseListener(){
    try{ if(firebaseDb && firebaseListenerAttached) firebaseDb.ref(FIREBASE_DB_PATH).off("value"); }catch(e){}
    firebaseListenerAttached = false; firebaseApp = null; firebaseDb = null;
  }

  function attachFirebaseListener(){
    if(!firebaseDb || firebaseListenerAttached) return;
    firebaseListenerAttached = true;
    firebaseDb.ref(FIREBASE_DB_PATH).on("value", function(snapshot){
      handleRemoteStateUpdate(snapshot.val());
    }, function(err){
      console.error("실시간 동기화 오류:", err);
      syncStatus = {state:"offline", lastSync:syncStatus.lastSync, message:err.message};
      render();
    });
  }

  // local과 remote 배열(여행 목록 / 카테고리 목록)을 id 기준으로 병합.
  // 각 레코드의 _ts(마지막 수정 시각)를 비교해 더 최신 쪽을 채택하고,
  // 삭제된 항목은 tombstones에 기록해두어 되살아나지 않게 한다.
  function mergeRecords(local, remote, tombstones){
    local = local || []; remote = remote || [];
    var byId = {};
    local.forEach(function(r){ byId[r.id] = r; });
    remote.forEach(function(r){
      var loc = byId[r.id];
      if(!loc || (r._ts||0) > (loc._ts||0)) byId[r.id] = r;
    });
    var order = local.map(function(r){ return r.id; });
    remote.forEach(function(r){ if(order.indexOf(r.id)===-1) order.push(r.id); });
    return order.map(function(id){ return byId[id]; }).filter(function(r){
      return r && !(tombstones[r.id] && tombstones[r.id] >= (r._ts||0));
    });
  }

  function handleRemoteStateUpdate(remote){
    if(pendingLocalPush) return; // 내가 아직 못 올린 변경사항이 있으면, 원격 스냅샷으로 덮어쓰지 않는다
    if(!remote){ syncStatus = {state:"ok", lastSync:new Date().toISOString(), message:""}; render(); return; }
    var tombstones = Object.assign({}, state._tombstones||{}, remote._tombstones||{});
    state.trips = mergeRecords(state.trips, remote.trips, tombstones);
    state.packing.domestic = mergeRecords(state.packing.domestic, remote.packing && remote.packing.domestic, tombstones);
    state.packing.international = mergeRecords(state.packing.international, remote.packing && remote.packing.international, tombstones);
    state._tombstones = tombstones;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
    syncStatus = {state:"ok", lastSync:new Date().toISOString(), message:""};
    render();
  }

  function scheduleServerPush(){
    if(!getFirebaseConfig()) return;
    pendingLocalPush = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushToServer, 250);
  }

  function pushToServer(){
    if(!getFirebaseConfig()) return;
    if(!firebaseDb){ initFirebaseSync(false); if(!firebaseDb) return; }
    syncStatus.state = "syncing"; render();
    var payload = { trips: state.trips, packing: state.packing, _tombstones: state._tombstones||{} };
    firebaseDb.ref(FIREBASE_DB_PATH).set(payload).then(function(){
      syncStatus = {state:"ok", lastSync:new Date().toISOString(), message:""};
      pendingLocalPush = false;
      render();
    }).catch(function(e){
      console.error("실시간 저장 실패:", e);
      syncStatus = {state:"error", lastSync:syncStatus.lastSync, message:e.message};
      render();
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushToServer, 3000);
    });
  }

  function syncBadgeInfo(){
    if(!getFirebaseConfig()) return {cls:"idle", text:"☁️ 로컬 전용 모드 (누르면 실시간 공유 설정)"};
    if(syncStatus.state==="syncing") return {cls:"syncing", text:"☁️ 동기화 중..."};
    if(syncStatus.state==="error") return {cls:"error", text:"☁️ 저장 실패 · 재시도 중"};
    if(syncStatus.state==="offline") return {cls:"offline", text:"☁️ 연결 끊김 · 재시도 중"};
    if(syncStatus.lastSync) return {cls:"ok", text:"☁️ 실시간 공유 중"};
    return {cls:"idle", text:"☁️ 연결 대기 중"};
  }

  /* ================= RENDER ================= */
  function render(){
    var flatAll = flattenItems(state.packing.domestic).concat(flattenItems(state.packing.international));
    var packedTotal = flatAll.length;
    var packedDone = flatAll.filter(function(i){return i.checked;}).length;

    var html = '<div class="shell">';
    html += renderSidebar(packedDone, packedTotal);
    html += '<main class="main">' + (
      nav.view==="home" ? renderHome() :
      nav.view==="trip" ? renderTripDetail(nav.tripId) :
      renderPacking()
    ) + '</main>';
    html += '</div>';
    if(modal) html += renderModal();

    document.getElementById("app").innerHTML = html;
    afterRender();
  }

  function renderSidebar(done,total){
    var sb = syncBadgeInfo();
    return '' +
    '<aside class="sidebar">' +
      '<div class="brand"><div class="brand-mark">✈️</div><div class="brand-text"><b>가가투어</b><span>GAGA TOUR PLANNER</span></div></div>' +
      '<nav class="sidebar-nav">' +
        '<button class="nav-item '+(nav.view==="home"||nav.view==="trip"?"active":"")+'" data-action="goHome"><span class="ic">🧭</span>여행리스트</button>' +
        '<button class="nav-item '+(nav.view==="packing"?"active":"")+'" data-action="goPacking"><span class="ic">🧳</span>체크리스트<span class="nav-badge">'+done+'/'+total+'</span></button>' +
      '</nav>' +
      '<div class="sidebar-foot">' +
        '<button class="sync-badge '+sb.cls+'" data-action="openSyncSetup" title="실시간 공유 설정"><span class="sync-dot"></span>'+sb.text+'</button>' +
        '<span>계획부터 실비 정산까지,<br>한 곳에서 정리하는 여행 기록 🗺️</span>' +
      '</div>' +
    '</aside>';
  }

  function sortTrips(list){
    return list.slice().sort(function(a,b){
      var sa=tripStatus(a), sb=tripStatus(b);
      var rank = {ongoing:0, upcoming:1, done:2};
      if(rank[sa.kind]!==rank[sb.kind]) return rank[sa.kind]-rank[sb.kind];
      return dateOnly(a.startDate) - dateOnly(b.startDate);
    });
  }

  function renderHome(){
    var trips = state.trips;
    var upcoming = trips.filter(function(t){ return tripStatus(t).kind==="upcoming"; })
      .sort(function(a,b){ return tripStatus(a).days - tripStatus(b).days; });
    var nearest = upcoming[0];
    var doneCount = trips.filter(function(t){ return tripStatus(t).kind==="done"; }).length;

    var html = '';
    html += '<div class="page-head"><div><h1>여행리스트 🧭</h1><p>그동안의 여행지를 확인하고 새 여행을 계획해보세요.</p></div>' +
      '<button class="btn btn-primary" data-action="openAddTrip">＋ 새 여행 만들기</button></div>';

    html += '<div class="stats-row">' +
      '<div class="stat-tile"><div class="ic">🗺️</div><div><b class="num">'+trips.length+'</b><span>등록된 여행</span></div></div>' +
      '<div class="stat-tile alt"><div class="ic">⏳</div><div><b class="num">'+(nearest? "D-"+tripStatus(nearest).days : "-")+'</b><span>'+(nearest? esc(nearest.locked && !unlockedData[nearest.id] ? "비공개 여행" : nearest.name)+" 까지" : "예정된 여행 없음")+'</span></div></div>' +
      '<div class="stat-tile gold"><div class="ic">✅</div><div><b class="num">'+doneCount+'</b><span>다녀온 여행</span></div></div>' +
    '</div>';

    html += '<div class="eyebrow">그동안의 여행지</div>';
    html += '<div class="tabbar">' +
      '<button class="tab '+(nav.tripTab==="domestic"?"active":"")+'" data-action="setTripTab" data-tab="domestic"><span class="ic">🏠</span>국내 ('+trips.filter(function(t){return t.type==="domestic";}).length+')</button>' +
      '<button class="tab '+(nav.tripTab==="international"?"active":"")+'" data-action="setTripTab" data-tab="international"><span class="ic">🌍</span>해외 ('+trips.filter(function(t){return t.type==="international";}).length+')</button>' +
    '</div>';

    var list = sortTrips(trips.filter(function(t){ return t.type===nav.tripTab; }));
    if(list.length===0){
      html += '<div class="empty"><span class="big">'+(nav.tripTab==="domestic"?"🧭":"🌍")+'</span>아직 등록된 '+(nav.tripTab==="domestic"?"국내":"해외")+' 여행이 없어요.<br>“새 여행 만들기”로 여행지를 추가해보세요.</div>';
    } else {
      html += '<div class="trip-grid">';
      list.forEach(function(t){
        var st = tripStatus(t);
        var isLockedClosed = t.locked && !unlockedData[t.id];
        var view = isLockedClosed ? null : getTrip(t.id);
        html += '<button class="ticket '+(t.type==="international"?"intl":"")+'" data-action="openTrip" data-id="'+t.id+'">' +
          '<div class="ticket-stub'+(!isLockedClosed && view.photo?" has-photo":"")+'"'+(!isLockedClosed && view.photo?' style="background-image:url(\''+view.photo+'\')"':'')+'><span class="emoji">'+t.emoji+'</span><span class="dday num">'+st.label+'</span></div>' +
          '<div class="ticket-body">' +
            '<span class="place">'+(isLockedClosed?'🔒 비공개':esc(view.place))+'</span>' +
            '<h3>'+(isLockedClosed?'비공개 여행':esc(view.name))+'</h3>' +
            '<span class="dates num">'+fmtRange(t.startDate,t.endDate)+'</span>' +
            '<div class="ticket-meta">' +
              (isLockedClosed ? '' :
                '<span class="pill">👥 '+totalTravelers(view)+'명</span>' +
                '<span class="pill">💰 '+won(planTotal(view))+'</span>') +
              (t.locked ? '<span class="pill lock-pill">🔒 보호됨</span>' : '') +
              (st.kind==="ongoing"?'<span class="pill status-ongoing">✈️ 여행중</span>':'') +
              (st.kind==="done"?'<span class="pill status-done">✔ 완료</span>':'') +
            '</div>' +
          '</div>' +
          '<span class="icon-btn trip-del" data-action="askDeleteTrip" data-id="'+t.id+'" title="삭제">🗑️</span>' +
        '</button>';
      });
      html += '</div>';
    }
    return html;
  }

  function getColumns(t){
    var isIntl = t.type==="international";
    var cols = [
      {field:"date", label:"일자"},
      {field:"dep", label:"출발"},
      {field:"arr", label:"도착"},
      {field:"dur", label:"소요시간"},
      {field:"place", label:"장소"}
    ];
    cols.push({field:"detail", label:"상세내용"});
    cols.push({field:"cost", label: isIntl ? ("비용 ("+(t.currency||"현지")+")") : "비용(원)"});
    if(isIntl){
      cols.push({field:"rate", label:"환율(원)"});
      cols.push({field:"krw", label:"원화환산"});
    }
    cols.push({field:"per", label:"1인 비용"});
    cols.push({field:"actions", label:"", fixed:true});
    return cols;
  }

  function cellHtml(t, item, field, idx, total){
    var krw = toKRW(t, item.cost, item.rate);
    var per = krw / totalTravelers(t);
    switch(field){
      case "date": return '<td><input type="date" value="'+(item.date||t.startDate)+'" min="'+t.startDate+'" max="'+t.endDate+'" data-cell data-kind="itin" data-field="date" data-trip="'+t.id+'" data-item="'+item.id+'"></td>';
      case "dep": return '<td><input type="time" value="'+(item.dep||"")+'" data-cell data-kind="itin" data-field="dep" data-trip="'+t.id+'" data-item="'+item.id+'"></td>';
      case "arr": return '<td><input type="time" value="'+(item.arr||"")+'" data-cell data-kind="itin" data-field="arr" data-trip="'+t.id+'" data-item="'+item.id+'"></td>';
      case "dur": return '<td class="readonly">'+formatDuration(item.dep,item.arr)+'</td>';
      case "place": return '<td><input type="text" value="'+esc(item.place||"")+'" placeholder="장소" data-cell data-kind="itin" data-field="place" data-trip="'+t.id+'" data-item="'+item.id+'"></td>';
      case "detail": return '<td><input type="text" value="'+esc(item.detail||"")+'" placeholder="메모" data-cell data-kind="itin" data-field="detail" data-trip="'+t.id+'" data-item="'+item.id+'"></td>';
      case "cost": return '<td><input type="number" min="0" step="'+(t.type==="international"?"1":"1000")+'" value="'+(item.cost||0)+'" data-cell data-kind="itin" data-field="cost" data-trip="'+t.id+'" data-item="'+item.id+'"></td>';
      case "rate": return '<td><input type="number" min="0" step="0.01" value="'+(item.rate!=null?item.rate:1)+'" data-cell data-kind="itin" data-field="rate" data-trip="'+t.id+'" data-item="'+item.id+'"></td>';
      case "krw": return '<td class="readonly">'+won(Math.round(krw))+'</td>';
      case "per": return '<td class="readonly">'+won(Math.round(per))+'</td>';
      case "actions": return '<td><div class="row-actions">' +
          '<button class="row-del" data-action="moveItineraryRow" data-dir="-1" data-trip="'+t.id+'" data-item="'+item.id+'" '+(idx===0?"disabled":"")+' title="위로 이동">▲</button>' +
          '<button class="row-del" data-action="moveItineraryRow" data-dir="1" data-trip="'+t.id+'" data-item="'+item.id+'" '+(idx===total-1?"disabled":"")+' title="아래로 이동">▼</button>' +
          '<button class="row-del" data-action="deleteItineraryRow" data-trip="'+t.id+'" data-item="'+item.id+'" title="행 삭제">✕</button>' +
        '</div></td>';
    }
    return '<td></td>';
  }

  function renderItinerarySheet(t){
    var isIntl = t.type==="international";
    var rows = t.itinerary || [];
    var cols = getColumns(t);
    var totalW = cols.reduce(function(s,c){ return s+colWidth(c.field); },0);

    var html = '<div class="sheet-wrap"><table class="sheet" style="width:'+totalW+'px"><colgroup>' +
      cols.map(function(c){ return '<col data-field="'+c.field+'" style="width:'+colWidth(c.field)+'px">'; }).join('') +
    '</colgroup><thead><tr>' +
      cols.map(function(c){ return '<th>'+esc(c.label)+(c.fixed?'':'<span class="col-resizer" data-field="'+c.field+'"></span>')+'</th>'; }).join('') +
    '</tr></thead><tbody>';

    if(rows.length===0){
      html += '<tr><td colspan="'+cols.length+'" style="text-align:center;color:var(--ink-faint);padding:26px 0;font-size:13px;">아직 등록된 일정이 없어요. 아래 “+ 행 추가”로 스프레드시트처럼 바로 입력해보세요.</td></tr>';
    }
    rows.forEach(function(item, idx){
      html += '<tr>' + cols.map(function(c){ return cellHtml(t, item, c.field, idx, rows.length); }).join('') + '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="sheet-add"><button class="btn btn-ghost btn-sm" data-action="addItineraryRow" data-id="'+t.id+'">＋ 행 추가</button>' +
      '<span class="sheet-hint">헤더 경계를 드래그하면 칸 너비를, ▲▼ 버튼으로 행 순서를 바꿀 수 있어요.'+(isIntl?' 그날의 환율을 입력하면 원화 비용이 자동 계산돼요.':'')+'</span>' +
    '</div>';
    return html;
  }

  function renderLockScreen(meta){
    return '<button class="back-link" data-action="goHome">← 여행리스트로</button>' +
      '<div class="card lock-card">' +
        '<div class="lock-emoji">🔒</div>' +
        '<h2>비공개 여행</h2>' +
        '<p>비밀번호를 입력하면 볼 수 있어요.</p>' +
        '<form data-action="submitUnlock" data-trip="'+meta.id+'">' +
          '<input type="password" name="password" placeholder="비밀번호" required autofocus>' +
          '<button class="btn btn-primary" type="submit">잠금 해제</button>' +
        '</form>' +
      '</div>';
  }

  function renderTripDetail(id){
    var meta = state.trips.find(function(x){ return x.id===id; });
    if(!meta){ nav.view="home"; return renderHome(); }
    if(meta.locked && !unlockedData[id]) return renderLockScreen(meta);
    var t = getTrip(id);
    var st = tripStatus(t);
    var isIntl = t.type==="international";

    var html = '<button class="back-link" data-action="goHome">← 여행리스트로</button>';

    html += '<div class="trip-head">' +
      '<div class="photo-wrap">' +
        (t.photo ? '<img src="'+t.photo+'" alt="">' : '<span>'+t.emoji+'</span>') +
        '<label class="photo-edit" title="대표사진 변경">📷<input type="file" accept="image/*" data-photo-input="1" data-trip="'+t.id+'" style="display:none;"></label>' +
        (t.photo ? '<button class="icon-btn sm photo-remove" data-action="removeTripPhoto" data-id="'+t.id+'" title="사진 삭제">✕</button>' : '') +
      '</div>' +
      '<div class="info">' +
        '<h1>'+esc(t.name)+
          '<button class="icon-btn sm" data-action="openEditTripMeta" data-id="'+t.id+'" title="여행 정보 수정">✎</button>' +
          (t.locked ?
            '<button class="icon-btn sm" data-action="openPasswordModal" data-id="'+t.id+'" title="비밀번호 보호 중 (변경·해제)">🔒</button>' :
            '<button class="icon-btn sm" data-action="openPasswordModal" data-id="'+t.id+'" title="비밀번호로 보호">🔓</button>') +
        '</h1>' +
        '<div class="meta-line">' +
          '<span>📍 '+esc(t.place)+'</span>' +
          '<span class="num">🗓 '+fmtRange(t.startDate,t.endDate)+'</span>' +
          '<span class="pill '+(st.kind==="ongoing"?"status-ongoing":st.kind==="done"?"status-done":"")+'">'+(st.kind==="upcoming"?"⏳ ":"")+ st.label+'</span>' +
          (isIntl? '<span class="pill currency">💱 '+esc(t.currency||"USD")+'</span>' : '') +
          (!isIntl && isHttpUrl(t.mapUrl) ? '<a href="'+esc(t.mapUrl)+'" target="_blank" rel="noopener noreferrer" class="pill map-pill">🗺️ 지도 보기</a>' : '') +
        '</div>' +
        '<div class="companions">' +
          '<span class="chip me">🙋 나</span>' +
          (t.companions||[]).map(function(c){ return '<span class="chip">🧑‍🤝‍🧑 '+esc(c)+'</span>'; }).join('') +
        '</div>' +
      '</div>' +
    '</div>';

    html += '<div class="detail-grid">';

    // main column
    html += '<div class="main-col">';
    html += '<div class="card">' +
      '<div class="card-head"><h2>🗓️ 상세 일정</h2></div>' +
      renderItinerarySheet(t) +
    '</div>';

    html += '<div class="split-row">' + renderBudgetCard(t) + renderRestaurantCard(t) + '</div>';
    html += '</div>'; // main-col

    // right rail
    html += '<div class="rail">';
    html += '<div class="card">' +
      '<div class="card-head"><h2>📝 여행 메모</h2></div>' +
      '<div class="note-box"><textarea placeholder="준비물 다짐, 여행 목표, 참고 링크 등을 자유롭게 적어보세요." data-note="1" data-id="'+t.id+'">'+esc(t.note||"")+'</textarea></div>' +
    '</div>';
    html += '</div>'; // rail

    html += '</div>'; // detail-grid
    return html;
  }

  function renderBudgetCard(t){
    var isIntl = t.type==="international";
    var travelers = totalTravelers(t);
    var plan = planTotal(t), actual = actualTotal(t);
    var maxBar = Math.max(plan, actual, 1);
    var diff = actual - plan;
    return '<div class="card">' +
      '<div class="card-head"><h2>💰 비용 정산</h2></div>' +
      '<div class="rail-section">' +
        '<div class="rail-label">계획 vs 실제 지출 (원화 기준)</div>' +
        '<div class="compare-bar">' +
          '<div class="row"><span>계획</span><span class="num">'+won(plan)+'</span></div>' +
          '<div class="track"><div class="fill plan" style="width:'+Math.round(plan/maxBar*100)+'%"></div></div>' +
        '</div>' +
        '<div class="compare-bar">' +
          '<div class="row"><span>실제</span><span class="num">'+won(actual)+'</span></div>' +
          '<div class="track"><div class="fill actual" style="width:'+Math.round(actual/maxBar*100)+'%"></div></div>' +
        '</div>' +
      '</div>' +
      '<div class="rail-section">' +
        '<div class="sum-line"><span class="k">총 인원</span><span class="v">'+travelers+'명</span></div>' +
        '<div class="sum-line"><span class="k">1인당 계획 비용</span><span class="v num">'+won(Math.round(plan/travelers))+'</span></div>' +
        '<div class="sum-line"><span class="k">1인당 실제 비용</span><span class="v num">'+won(Math.round(actual/travelers))+'</span></div>' +
        '<div class="sum-line diff"><span class="k">예산 대비 차액</span><span class="v num '+(diff>0?"pos":"neg")+'">'+(diff>0?"+":"")+won(diff)+'</span></div>' +
        '<div class="sum-line total"><span class="k">총 실제 지출</span><span class="v num">'+won(actual)+'</span></div>' +
      '</div>' +
      '<div class="rail-section" style="margin-bottom:0;">' +
        '<div class="rail-label" style="margin-bottom:10px;">실제 사용 내역</div>' +
        ((t.expenses||[]).length===0 ? '<div class="empty" style="padding:18px 10px;"><span class="big">🧾</span>사용한 비용을 기록해보세요.</div>' :
          (t.expenses||[]).slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"");}).map(function(ex){
            var krw = toKRW(t, ex.amount, ex.rate);
            return '<div class="expense-item">' +
              '<div><div class="item">'+esc(ex.item)+'</div><div class="meta num">'+ex.date+(isIntl? " · "+localAmt(t,ex.amount)+" × "+(ex.rate||1) : "")+'</div></div>' +
              '<div style="display:flex;align-items:center;gap:6px;"><span class="amt num">'+won(Math.round(krw))+'</span>' +
              '<button class="icon-btn sm" data-action="deleteExpense" data-trip="'+t.id+'" data-item="'+ex.id+'" title="삭제">✕</button></div>' +
            '</div>';
          }).join('')
        ) +
        '<form class="exp-add" data-action="submitExpense" data-trip="'+t.id+'">' +
          '<input type="date" name="date" value="'+clampDate(todayStr(), t.startDate, t.endDate)+'" min="'+t.startDate+'" max="'+t.endDate+'">' +
          '<input type="text" name="item" placeholder="항목 (예: 저녁 식사)" required>' +
          (isIntl ?
            '<div class="row2"><input type="number" name="amount" min="0" step="1" placeholder="현지비용('+esc(t.currency||"")+')" required><input type="number" name="rate" min="0" step="0.01" placeholder="환율(원)" value="1"></div>'
            : '<input type="number" name="amount" min="0" step="100" placeholder="금액(원)" required>') +
          '<button class="btn btn-coral btn-sm" type="submit">＋ 지출 추가</button>' +
        '</form>' +
      '</div>' +
    '</div>';
  }

  function renderRestaurantCard(t){
    var list = t.restaurants || [];
    return '<div class="card">' +
      '<div class="card-head"><h2>🍽️ 맛집 리스트</h2></div>' +
      (list.length===0 ? '<div class="empty" style="padding:18px 10px;"><span class="big">🍜</span>가보고 싶은 맛집을 기록해보세요.</div>' :
        list.map(function(r){
          return '<div class="resto-item">' +
            '<div class="resto-main"><div class="resto-name">'+esc(r.name)+'</div><div class="resto-meta">'+[r.menu,r.price].filter(Boolean).map(esc).join(' · ')+'</div></div>' +

  /* ================= IMAGE HELPER ================= */
  function resizeImageFile(file, maxDim, quality, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim/Math.max(w,h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        cb(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

    },
    confirmDelete: function(el){
      var op = el.dataset.op;
      var now = Date.now();
      if(op==="trip"){
        state._tombstones[el.dataset.a] = now;
        state.trips = state.trips.filter(function(t){return t.id!==el.dataset.a;});
        delete unlockedData[el.dataset.a]; delete unlockedKeys[el.dataset.a];
        if(nav.tripId===el.dataset.a){nav.view="home";nav.tripId=null;}
      }
      if(op==="category"){
        state._tombstones[el.dataset.b] = now;
        state.packing[el.dataset.a] = state.packing[el.dataset.a].filter(function(c){return c.id!==el.dataset.b;});
      }
      if(op==="removePassword"){
        var tripId = el.dataset.a;
        var view = unlockedData[tripId];
        if(view){
          view.locked = false;
          var idx = state.trips.findIndex(function(x){return x.id===tripId;});
          if(idx>=0) state.trips[idx] = view;
          delete unlockedData[tripId]; delete unlockedKeys[tripId];
        }
      }
      save(); modal=null; render();
    },

      touch(t); render(); commitAndSave(t.id);

  var formActions = {
    submitAddTrip: function(form){
      var fd = new FormData(form);
      var type = fd.get("type");
      var placeSel = fd.get("place");
      var customVal = (fd.get("placeCustom")||"").trim();
      var opts = type==="domestic"?domesticPlaces:intlPlaces;
      var isCustom = placeSel.indexOf("직접 입력")>-1;
      var place = isCustom ? (customVal || "여행지 미정") : placeSel;
      var emoji = isCustom ? (type==="domestic"?"📍":"🌍") : (opts.find(function(p){return p.n===placeSel;})||{}).e || "📍";
      var companions = (fd.get("companions")||"").split(",").map(function(s){return s.trim();}).filter(Boolean);
      var trip = {
        id: uid(), type: type, name: fd.get("name").trim(), place: place, emoji: emoji,
        startDate: fd.get("startDate"), endDate: fd.get("endDate"),
        companions: companions, itinerary: [], expenses: [], restaurants: [], note: "", _ts: Date.now()
      };
      if(type==="international") trip.currency = (fd.get("currency")||"USD").trim() || "USD";
      if(dateOnly(trip.endDate) < dateOnly(trip.startDate)) trip.endDate = trip.startDate;
      state.trips.push(trip); save(); modal=null; nav.tripTab = type; render();
    },
    submitEditTripMeta: function(form){
      var fd = new FormData(form);
      var t = getTrip(fd.get("tripId"));
      t.name = (fd.get("name")||"").trim() || t.name;
      t.place = (fd.get("place")||"").trim() || t.place;
      var newStart = fd.get("startDate") || t.startDate;
      var newEnd = fd.get("endDate") || t.endDate;
      if(dateOnly(newEnd) < dateOnly(newStart)) newEnd = newStart;
      t.startDate = newStart; t.endDate = newEnd;
      t.companions = (fd.get("companions")||"").split(",").map(function(s){return s.trim();}).filter(Boolean);
      if(t.type==="international") t.currency = (fd.get("currency")||"USD").trim() || "USD";
      if(t.type==="domestic") t.mapUrl = (fd.get("mapUrl")||"").trim();
      touch(t); modal=null; render(); commitAndSave(t.id);
    },
    submitSetPassword: function(form){
      var fd = new FormData(form);
      var tripId = fd.get("tripId");
      var pw1 = fd.get("pw1"), pw2 = fd.get("pw2");
      if(pw1 !== pw2){ window.alert("비밀번호가 서로 달라요."); return; }
      var view = getTrip(tripId);
      if(!view) return;
      var salt = crypto.getRandomValues(new Uint8Array(16));
      deriveKey(pw1, salt).then(function(key){
        unlockedKeys[tripId] = { key:key, saltB64: bufToB64(salt) };
        if(!unlockedData[tripId]) unlockedData[tripId] = view;
        unlockedData[tripId].locked = true;
        modal = null; render();
        commitAndSave(tripId);
      });
    },
    submitUnlock: function(form){
      var tripId = form.dataset.trip;
      var pw = new FormData(form).get("password");
      var meta = state.trips.find(function(t){ return t.id===tripId; });
      if(!meta) return;
      decryptTripPayload(pw, meta.salt, meta.iv, meta.cipher).then(function(result){
        unlockedKeys[tripId] = { key: result.key, saltB64: meta.salt };
        unlockedData[tripId] = Object.assign(
          { id: meta.id, type: meta.type, startDate: meta.startDate, endDate: meta.endDate, emoji: meta.emoji, locked: true, _ts: meta._ts },
          result.payload
        );
        render();
      }).catch(function(){
        window.alert("비밀번호가 올바르지 않아요.");
      });
    },
    submitRestaurant: function(form){
      var tripId = form.dataset.trip;
      var t = getTrip(tripId);
      var fd = new FormData(form);
      var name = (fd.get("name")||"").trim();
      if(!name) return;
      t.restaurants.push({
        id: uid(), name: name,
        menu: (fd.get("menu")||"").trim(),
        price: (fd.get("price")||"").trim(),
        link: (fd.get("link")||"").trim()
      });
      touch(t); render(); commitAndSave(t.id);
    },
    submitExpense: function(form){
      var tripId = form.dataset.trip;
      var t = getTrip(tripId);
      var fd = new FormData(form);
      var entry = {
        id: uid(),
        date: clampDate(fd.get("date")||todayStr(), t.startDate, t.endDate),
        item: (fd.get("item")||"").trim(),
        amount: Number(fd.get("amount"))||0
      };
      if(!entry.item) return;
      if(t.type==="international") entry.rate = Number(fd.get("rate"))||1;
      t.expenses.push(entry); touch(t); render(); commitAndSave(t.id);
    },
    submitAddCategory: function(form){
      var type = form.dataset.type;
      var name = (new FormData(form).get("name")||"").trim();
      if(name) state.packing[type].push({id:uid(), name:name, items:[], _ts:Date.now()});
      save(); render();
    },
    submitAddCatItem: function(form){
      var type = form.dataset.type, catId = form.dataset.cat;
      var cat = state.packing[type].find(function(c){return c.id===catId;});
      var text = (new FormData(form).get("text")||"").trim();
      if(text) cat.items.push({id:uid(), text:text, checked:false});
      touch(cat); save(); render();
    }
  };

  function commitCell(el){
    var kind = el.dataset.kind;
    if(kind==="itin"){
      var t = getTrip(el.dataset.trip);
      var item = t.itinerary.find(function(i){return i.id===el.dataset.item;});
      if(!item) return;
      var field = el.dataset.field;
      item[field] = (field==="cost"||field==="rate") ? (Number(el.value)||0) : el.value;
      touch(t); render(); commitAndSave(t.id);
    } else if(kind==="catname"){
      var cat = state.packing[el.dataset.type].find(function(c){return c.id===el.dataset.cat;});
      if(el.value.trim()) cat.name = el.value.trim();
      nav.editingCatId = null;
      touch(cat); save(); render();
    }
  }

  function handlePhotoInput(el){
    var file = el.files && el.files[0];
    if(!file) return;
    var tripId = el.dataset.trip;
    resizeImageFile(file, 640, 0.75, function(dataUrl){
      var t = getTrip(tripId);
      if(t){ t.photo = dataUrl; touch(t); render(); commitAndSave(t.id); }
    });
  }

  function afterRender(){
    var placeSel = document.getElementById("f_place");
    if(placeSel){
      placeSel.addEventListener("change", function(){
        var custom = document.getElementById("f_placeCustom");
        if(this.value.indexOf("직접 입력")>-1){ custom.style.display="block"; custom.focus(); }
        else { custom.style.display="none"; }
        var curInput = document.getElementById("f_currency");
        if(curInput && document.getElementById("f_currencyWrap").style.display!=="none"){
          curInput.value = placeCurrency[this.value] || curInput.value || "USD";
        }
      });
    }
    var noteBox = document.querySelector('[data-note="1"]');
    if(noteBox){
      noteBox.addEventListener("blur", function(){
        var t = getTrip(this.dataset.id);
        if(t){ t.note = this.value; touch(t); commitAndSave(t.id); }
      });
    }
    var focusEl = document.querySelector('[data-focus="1"]');
    if(focusEl){ focusEl.focus(); focusEl.select(); }
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.dataset.action;
    if(action==="overlayClose"){ actions.overlayClose(el,e); return; }
    if(el.hasAttribute("data-stop")) return;
    if(actions[action]) actions[action](el,e);
  });

  document.addEventListener("submit", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    e.preventDefault();
    var action = el.dataset.action;
    if(formActions[action]) formActions[action](el);
  });

  document.addEventListener("change", function(e){
    var el = e.target;
    if(el.matches && el.matches("[data-cell]")){ commitCell(el); return; }
    if(el.matches && el.matches("[data-photo-input]")){ handlePhotoInput(el); return; }
    var actEl = el.closest && el.closest("[data-action]");
    if(actEl && actEl.dataset.action==="togglePack") actions.togglePack(actEl);
  });

  document.addEventListener("keydown", function(e){
    if(e.key==="Enter" && e.target.matches && e.target.matches("[data-cell]")){
      if(e.target.tagName==="INPUT" && e.target.type!=="date"){ e.preventDefault(); }
      e.target.blur();
    }
  });

  /* ---------- column resize (pointer drag) ---------- */
  document.addEventListener("pointerdown", function(e){
    var handle = e.target.closest && e.target.closest(".col-resizer");
    if(!handle) return;
    e.preventDefault();
    var field = handle.dataset.field;
    var table = handle.closest("table.sheet");
    var col = table && table.querySelector('col[data-field="'+field+'"]');
    var th = handle.closest("th");
    if(!col || !th || !table) return;
    resizing = { field: field, startX: e.clientX, startWidth: th.getBoundingClientRect().width, startTableWidth: table.getBoundingClientRect().width, col: col, table: table, handle: handle };
    handle.classList.add("active");
    document.body.style.userSelect = "none";
  });
  document.addEventListener("pointermove", function(e){
    if(!resizing) return;
    var delta = e.clientX - resizing.startX;
    var newW = Math.max(40, Math.round(resizing.startWidth + delta));
    var appliedDelta = newW - resizing.startWidth;
    resizing.col.style.width = newW + "px";
    resizing.table.style.width = Math.round(resizing.startTableWidth + appliedDelta) + "px";
  });
  document.addEventListener("pointerup", function(){
    if(!resizing) return;
    var newW = parseInt(resizing.col.style.width, 10);
    state.colWidths[resizing.field] = newW;
    resizing.handle.classList.remove("active");
    document.body.style.userSelect = "";
    resizing = null;
    save();
  });

  render();
  initFirebaseSync(false);
})();
</script>
</body>
</html>
